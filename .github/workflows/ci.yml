name: CI

# Builds in release mode with warnings as errors, lints, and tests. These are the
# three commands AGENTS.md documents as the validation. Two runner images, because
# a newer SDK can hide errors an older one reports.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict

      - name: Test
        run: swift test
