name: Secret Scan

# Caller of the shared secret scan: scans the tracked files and the commits a
# push or pull request adds.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    uses: trsdn/.github/.github/workflows/secret-scan.yml@main
