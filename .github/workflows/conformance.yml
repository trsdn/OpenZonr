name: Conformance

# Caller of the shared conformance check. It validates .github/conformance.yml
# and the committed badge, and turns red when the assessment is overdue.

on:
  pull_request:
    paths:
      - .github/conformance.yml
      - .github/badges/**
      - .github/workflows/conformance.yml
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    uses: trsdn/.github/.github/workflows/conformance.yml@main
